<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in to Mantra...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }
    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid #222;
      border-top-color: #c0392b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #c0392b;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn:active { opacity: 0.8; }
    .btn-secondary {
      background: #1a1a1a;
      color: #aaa;
      font-size: 14px;
      padding: 12px;
    }
    .success { color: #27ae60; font-size: 32px; margin-bottom: 12px; }
    .error-msg { color: #c0392b; font-size: 15px; margin-bottom: 16px; }
    #status-msg { font-size: 13px; color: #666; margin-top: 12px; }
  </style>
</head>
<body>
<div class="card" id="loading-view">
  <div class="logo">🕉</div>
  <div class="title">Completing Sign In</div>
  <div class="subtitle">Returning you to Mantra...</div>
  <div class="spinner"></div>
  <div id="status-msg">Opening app...</div>
</div>

<div class="card" id="manual-view" style="display:none">
  <div class="success">✓</div>
  <div class="title">Signed In Successfully</div>
  <div class="subtitle" style="margin-bottom:24px">Tap the button below to return to Mantra</div>
  <a id="open-btn" class="btn" href="#">Open Mantra App</a>
  <div id="status-msg" style="margin-top:8px; font-size:12px; color:#555"></div>
</div>

<div class="card" id="error-view" style="display:none">
  <div class="logo">⚠️</div>
  <div class="error-msg" id="error-text">Sign in failed</div>
  <a class="btn btn-secondary" href="https://rinzin90.github.io/mantra/oauth/">Try Again</a>
</div>

<script>
  function show(id) {
    ['loading-view','manual-view','error-view'].forEach(function(v) {
      document.getElementById(v).style.display = v === id ? 'block' : 'none';
    });
  }

  // Parse token from URL hash
  var hash = window.location.hash.substring(1);
  var params = new URLSearchParams(hash);
  var accessToken = params.get('access_token');
  var expiresIn = params.get('expires_in');
  var error = params.get('error') || new URLSearchParams(window.location.search).get('error');

  if (error) {
    show('error-view');
    document.getElementById('error-text').textContent = 'Error: ' + error;

  } else if (accessToken) {
    // Build the deep link back to the app
    var deepLink = 'com.mantra.tracker://oauth2redirect#' + hash;
    var intentUrl = 'intent://oauth2redirect#' + hash +
      '#Intent;scheme=com.mantra.tracker;package=com.mantra.tracker;end';

    // Set the manual button href
    document.getElementById('open-btn').href = deepLink;

    // Try automatic redirect first (works if Chrome allows it)
    try {
      window.location.href = deepLink;
    } catch(e) {}

    // After short delay, if still here try intent URL (Android)
    setTimeout(function() {
      try { window.location.href = intentUrl; } catch(e) {}
    }, 500);

    // After another delay show the manual button
    setTimeout(function() {
      show('manual-view');
      document.getElementById('open-btn').href = deepLink;
      document.getElementById('status-msg').textContent =
        'If the app does not open automatically, tap the button above.';
    }, 1200);

  } else {
    // No token and no error — probably landed here directly
    show('error-view');
    document.getElementById('error-text').textContent =
      'No sign-in data found. Please try signing in again from the app.';
  }
</script>
</body>
</html>
