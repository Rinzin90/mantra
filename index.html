<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Signing in...</title>
  <style>
    body { background: #0a0a0a; color: white; font-family: sans-serif;
           display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; flex-direction: column; gap: 16px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #333;
               border-top-color: #c0392b; border-radius: 50%;
               animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Completing sign in...</p>
  <script>
    // Extract token from URL hash e.g. #access_token=xxx&token_type=Bearer&...
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    const expiresIn = params.get('expires_in');
    const tokenType = params.get('token_type');

    if (accessToken) {
      // Try redirecting back to the app via deep link
      const deepLink = 'com.mantra.tracker://oauth2redirect#' + hash;
      window.location.href = deepLink;

      // Fallback: if deep link doesn't work after 1.5s, show token for manual use
      setTimeout(function() {
        document.body.innerHTML =
          '<p style="color:#c0392b;font-size:18px;">Sign in successful!</p>' +
          '<p style="color:#aaa;font-size:14px;">You can close this window and return to the app.</p>';
      }, 1500);
    } else {
      // No token — might be an error
      const error = params.get('error') || new URLSearchParams(window.location.search).get('error');
      document.body.innerHTML =
        '<p style="color:#c0392b;">Sign in failed: ' + (error || 'Unknown error') + '</p>';
    }
  </script>
</body>
</html>
