<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in to Mantra...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a; color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .card { text-align: center; max-width: 320px; width: 100%; }
    .logo { font-size: 48px; margin-bottom: 16px; }
    .title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 32px; }
    .spinner {
      width: 44px; height: 44px; border: 3px solid #222;
      border-top-color: #c0392b; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: block; width: 100%; padding: 16px;
      background: #c0392b; color: white; border: none;
      border-radius: 14px; font-size: 16px; font-weight: 600;
      cursor: pointer; text-decoration: none; margin-bottom: 12px;
    }
    .success { color: #27ae60; font-size: 40px; margin-bottom: 12px; }
    .error-msg { color: #c0392b; font-size: 15px; margin-bottom: 16px; }
    #hint { font-size: 12px; color: #555; margin-top: 12px; }
  </style>
</head>
<body>
<div id="loading-view" class="card">
  <div class="logo">&#x1F549;</div>
  <div class="title">Completing Sign In</div>
  <div class="subtitle">Returning you to Mantra...</div>
  <div class="spinner"></div>
</div>
<div id="manual-view" class="card" style="display:none">
  <div class="success">&#x2713;</div>
  <div class="title">Signed In!</div>
  <div class="subtitle">Tap below to return to Mantra</div>
  <a id="open-btn" class="btn" href="#">Open Mantra App</a>
  <div id="hint">If the app does not open, tap the button above.</div>
</div>
<div id="error-view" class="card" style="display:none">
  <div class="logo">&#x26A0;&#xFE0F;</div>
  <div class="error-msg" id="error-text">Sign in failed.</div>
  <a class="btn" href="https://rinzin90.github.io/mantra/oauth/" style="background:#1a1a1a;color:#aaa;font-size:14px">Try Again</a>
</div>
<script>
  function show(id) {
    ['loading-view','manual-view','error-view'].forEach(function(v) {
      document.getElementById(v).style.display = (v === id) ? 'block' : 'none';
    });
  }
  var hash   = window.location.hash.substring(1);
  var params = new URLSearchParams(hash);
  var token  = params.get('access_token');
  var error  = params.get('error') || new URLSearchParams(window.location.search).get('error');
  if (error) {
    show('error-view');
    document.getElementById('error-text').textContent = 'Error: ' + error;
  } else if (token) {
    var queryStr  = hash;
    var deepLink  = 'com.mantra.tracker://oauth2redirect?' + queryStr;
    var intentUrl = 'intent://oauth2redirect?' + queryStr +
                    '#Intent;scheme=com.mantra.tracker;package=com.mantra.tracker;' +
                    'S.browser_fallback_url=https%3A%2F%2Frinzin90.github.io%2Fmantra%2Foauth%2F;end';
    document.getElementById('open-btn').href = intentUrl;
    try { window.location.href = intentUrl; } catch(e) {}
    setTimeout(function() { try { window.location.href = deepLink; } catch(e) {} }, 600);
    setTimeout(function() {
      show('manual-view');
      document.getElementById('open-btn').href = intentUrl;
    }, 1500);
  } else {
    show('error-view');
    document.getElementById('error-text').textContent = 'No sign-in data found. Please try again from the app.';
  }
</script>
</body>
</html>
